name: API Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Start ClickHouse
        run: docker compose up -d

      - name: Wait for ClickHouse
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8123/ping | grep -q "Ok"; then
              echo "ClickHouse is ready"
              exit 0
            fi
            echo "Waiting for ClickHouse... ($i/30)"
            sleep 2
          done
          echo "ClickHouse did not start in time"
          exit 1

      - name: Start Spring Boot in background
        run: |
          nohup ./gradlew bootRun > bootrun.log 2>&1 &
          echo "BootRun started in background"

      - name: Wait for Spring Boot
        run: |
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/events?limit=1 | grep -q "200"; then
              echo "Spring Boot is ready"
              exit 0
            fi
            echo "Waiting for Spring Boot... ($i/60)"
            sleep 2
          done
          echo "Spring Boot did not start in time"
          tail -100 bootrun.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

name: API Tests & Deploy Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Start ClickHouse
        run: docker compose up -d

      - name: Wait for ClickHouse
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8123/ping | grep -q "Ok" && exit 0
            sleep 2
          done
          exit 1

      - name: Start Spring Boot
        run: nohup ./gradlew bootRun > bootrun.log 2>&1 &

      - name: Wait for Spring Boot
        run: |
          for i in {1..60}; do
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/events?limit=1 | grep -q "200" && exit 0
            sleep 2
          done
          tail -100 bootrun.log
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno with HTML report
        run: |
          mkdir -p _site
          cd bruno-collection
          bru run --reporter-html ../_site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
