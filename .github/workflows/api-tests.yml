name: API Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Start ClickHouse
        run: docker compose up -d

      - name: Wait for ClickHouse
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8123/ping | grep -q "Ok"; then
              echo "ClickHouse is ready"
              exit 0
            fi
            echo "Waiting for ClickHouse... ($i/30)"
            sleep 2
          done
          echo "ClickHouse did not start in time"
          exit 1

      - name: Start Spring Boot in background
        run: |
          nohup ./gradlew bootRun > bootrun.log 2>&1 &
          echo "BootRun started in background"

      - name: Wait for Spring Boot
        run: |
          for i in {1..60}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/events?limit=1 | grep -q "200"; then
              echo "Spring Boot is ready"
              exit 0
            fi
            echo "Waiting for Spring Boot... ($i/60)"
            sleep 2
          done
          echo "Spring Boot did not start in time"
          tail -100 bootrun.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Bruno CLI
        run: npm install -g @usebruno/cli

      - name: Run Bruno with HTML report
        run: |
          mkdir -p _site
          cd bruno-collection
          bru run --reporter-html ../_site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
