services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3
    container_name: clickhouse-demo
    ports:
      - "8123:8123" # HTTP interface used by the JDBC driver
    environment:
      CLICKHOUSE_DB: appdb
      CLICKHOUSE_USER: app
      CLICKHOUSE_PASSWORD: app123
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse client --user app --password app123 --query 'SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  clickhouse-data:
